<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="dsh-design" content="app">
<title>宏详情 · AutoFlow</title><link rel="stylesheet" href="tokens.css">
</head><body><div class="screen">
  <div class="hd">
    <a class="icon-btn" href="home.html">‹</a>
    <div style="flex:1"><h1 style="font-size:19px">灯光闪烁</h1><div class="sub">双击电源键让闪光灯闪 5 次</div></div>
    <div class="switch on"></div>
  </div>

  <div class="sec"><div class="t">触发器</div><div class="n">1</div><a class="add" href="picker.html">＋ 添加</a></div>
  <div class="list">
    <a class="item" href="picker.html"><div class="ic">⚡</div>
      <div><div class="t">电源键双击</div><div class="s">任意界面 · 立即触发</div></div><div class="n">拖</div></a>
  </div>
  <div class="hint">多个触发器之间是「或」：任一满足即执行。</div>

  <div class="sec"><div class="t">动作</div><div class="n">6</div><a class="add" href="picker.html">＋ 添加</a></div>
  <div class="list">
    <div class="item"><div class="ic">1</div><div><div class="t">循环</div><div class="s">重复 5 次</div></div><div class="n">☰</div></div>
    <div class="item" style="margin-left:18px"><div class="ic">2</div><div><div class="t">手电筒 开</div><div class="s">在循环内</div></div><div class="n">☰</div></div>
    <div class="item" style="margin-left:18px"><div class="ic">3</div><div><div class="t">等待</div><div class="s">0.4 秒</div></div><div class="n">☰</div></div>
    <div class="item" style="margin-left:18px"><div class="ic">4</div><div><div class="t">手电筒 关</div><div class="s">在循环内</div></div><div class="n">☰</div></div>
    <div class="item" style="margin-left:18px"><div class="ic">5</div><div><div class="t">等待</div><div class="s">0.4 秒</div></div><div class="n">☰</div></div>
    <div class="item"><div class="ic">6</div><div><div class="t">结束循环</div><div class="s">循环至此回跳</div></div><div class="n">☰</div></div>
  </div>
  <div class="hint">动作按顺序执行；循环内的动作会重复执行，直到次数用完或执行「跳出循环」。</div>

  <div class="sec"><div class="t">约束</div><div class="n">0</div><a class="add" href="picker.html">＋ 添加</a></div>
  <div class="hint">约束是「与」：全部满足才执行，不满足就跳过本次触发。</div>

  <div class="bar" style="display:flex;gap:10px">
    <a class="btn ghost" href="home.html" style="flex:1">■ 停止</a>
    <a class="btn primary" href="home.html" style="flex:1.4">▶ 立即运行</a>
  </div>
</div></body></html>

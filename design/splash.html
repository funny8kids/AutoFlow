<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="dsh-design" content="app">
<title>启动页 · AutoFlow</title>
<style>
:root{--bg:#070B18;--ink:#EAF0FF;--muted:#93A1C6;--v:#6C7CFF;--mint:#33E1C4;--v2:#8E7CFF}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);font-family:-apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif;overflow:hidden}
.stage{position:relative;width:390px;height:844px;overflow:hidden;
  background:
    radial-gradient(120% 80% at 50% -10%, #1C2A63 0%, #0C1226 45%, #070B18 100%)}
/* 顶部光晕 */
.glow-top{position:absolute;left:50%;top:-160px;width:520px;height:520px;transform:translateX(-50%);
  background:radial-gradient(circle, rgba(108,124,255,.40) 0%, rgba(108,124,255,.12) 42%, transparent 70%);
  filter:blur(8px);animation:breathe 6s ease-in-out infinite}
/* 底部极光 */
.glow-bottom{position:absolute;left:50%;bottom:-220px;width:560px;height:420px;transform:translateX(-50%);
  background:radial-gradient(circle, rgba(51,225,196,.22) 0%, rgba(51,225,196,.06) 45%, transparent 72%);
  filter:blur(14px);animation:breathe 8s ease-in-out infinite reverse}
/* 细网格 */
.grid{position:absolute;inset:0;opacity:.16;
  background-image:linear-gradient(rgba(255,255,255,.14) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.14) 1px, transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(80% 60% at 50% 38%, #000 0%, transparent 78%)}
/* 中心 */
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.mark{position:relative;width:112px;height:112px;border-radius:34px;
  background:linear-gradient(150deg,#8A93FF 0%,#5B66E8 46%,#2E3AA8 100%);
  box-shadow:0 26px 60px rgba(84,98,255,.45), inset 0 1px 0 rgba(255,255,255,.45), inset 0 -18px 40px rgba(0,0,0,.35);
  display:grid;place-items:center;animation:markIn .7s cubic-bezier(.16,1,.3,1) both}
.mark svg{width:54px;height:54px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.ring{position:absolute;inset:-14px;border-radius:46px;border:1px solid rgba(140,152,255,.35);
  animation:ringPulse 2.8s cubic-bezier(.4,0,.2,1) infinite}
.ring.two{inset:-28px;border-color:rgba(140,152,255,.16);animation-delay:.5s}
.word{margin-top:30px;font-size:32px;font-weight:800;letter-spacing:.5px;color:var(--ink);
  animation:fadeUp .55s cubic-bezier(.16,1,.3,1) .06s both}
.word span{color:#AEB6FF;background:linear-gradient(96deg,#AEB6FF 8%,#7F8BFF 46%,#5FE7CF 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.tag{margin-top:10px;font-size:13.5px;letter-spacing:2.4px;color:rgba(174,187,222,.72);
  text-transform:uppercase;animation:fadeUp .55s cubic-bezier(.16,1,.3,1) .12s both}
/* 进度 */
.loader{position:absolute;left:50%;bottom:132px;transform:translateX(-50%);width:132px;height:3px;
  border-radius:99px;background:rgba(255,255,255,.10);overflow:hidden;
  animation:fadeIn .8s ease .55s both}
.loader::after{content:"";position:absolute;inset:0;border-radius:99px;
  background:linear-gradient(90deg,transparent,#6C7CFF 35%,#33E1C4 70%,transparent);
  width:60%;animation:slide 1.5s cubic-bezier(.4,0,.2,1) infinite}
/* 底部签名 */
.sign{position:absolute;left:0;right:0;bottom:52px;text-align:center;font-size:11.5px;letter-spacing:.6px;
  color:rgba(147,161,198,.55);animation:fadeIn 1s ease .8s both}
/* 版本角标 */
.ver{position:absolute;right:18px;bottom:18px;font-size:10.5px;color:rgba(147,161,198,.42)}
@keyframes markIn{0%{opacity:0;transform:scale(.72) rotate(-8deg)}60%{opacity:1}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes ringPulse{0%{opacity:.9;transform:scale(.92)}70%{opacity:0;transform:scale(1.18)}100%{opacity:0;transform:scale(1.18)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes breathe{0%,100%{opacity:.85}50%{opacity:1}}
@keyframes slide{0%{left:-60%}100%{left:100%}}
</style></head><body>
<div class="stage">
  <div class="glow-top"></div>
  <div class="glow-bottom"></div>
  <div class="grid"></div>
  <div class="center">
    <div class="mark">
      <div class="ring"></div><div class="ring two"></div>
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M25.5 5 11 27h9.2L19 43l15-23h-9.6L25.5 5Z" fill="url(#g)"/>
        <defs><linearGradient id="g" x1="11" y1="5" x2="34" y2="43" gradientUnits="userSpaceOnUse">
          <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#CFE7FF"/></linearGradient></defs>
      </svg>
    </div>
    <div class="word">Auto<span>Flow</span></div>
    <div class="tag">automate everything</div>
  </div>
  <div class="loader"></div>
  <div class="sign">让手机自己动起来</div>
  <div class="ver">2.6.0</div>
</div>
</body></html>

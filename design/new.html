<!doctype html><html lang="zh-CN"><head>

<meta name="dsh-design" content="app">
<title>新建宏 · AutoFlow</title><link rel="stylesheet" href="tokens.css">
</head><body><div class="screen">

  </div>

  <div style="height:4px;background:#222C4C;margin:0 16px;border-radius:99px;overflow:hidden">
    <div style="width:50%;height:100%;background:linear-gradient(90deg,#6C7CFF,#33E1C4)"></div>
  </div>

  <div class="step"><div class="idx">1</div><div class="body"><div class="k">触发器 <span style="color:#33E1C4">✓</span></div><div class="d">电源键双击</div></div><a class="go" href="picker.html">›</a></div>

  <div class="sec"><div class="t">当前动作</div><div class="n">6</div></div>
  <div class="list">
    <div class="item"><div class="ic">1</div><div><div class="t">循环 5 次</div></div><div class="n">☰</div></div>

  </div>

  <div class="bar" style="display:flex;gap:10px">
    <a class="btn ghost" href="home.html" style="flex:1">取消</a>
    <a class="btn primary" href="home.html" style="flex:1.6">保存并启用</a>
  </div>
